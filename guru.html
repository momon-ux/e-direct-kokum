<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8f8fb">
<title>Ruang Guru · e-Direct Kokum SK Ranggu</title>
<style>
:root {
  color-scheme: light;
  --ink: #182131;
  --muted: #57606b;
  --accent: #b82061;
  --accent-deep: #972052;
  --tint: #fff2f7;
  --edge: #e6e4e8;
  --white: #fff;
  font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f8f8fb; color: var(--ink); }
[hidden] { display: none !important; }
.wrap { width: min(1180px, calc(100% - 72px)); margin-inline: auto; }
.skip { position: absolute; left: 12px; top: -70px; padding: 8px; background: #fff; z-index: 3; }
.skip:focus { top: 8px; }
:focus-visible { outline: 3px solid #a92760; outline-offset: 3px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 90px; border-bottom: 1px solid var(--edge); }
.identity { display: flex; align-items: center; gap: 13px; }
.crest { width: 65px; height: 74px; object-fit: contain; }
.identity strong { display: block; font-size: 23px; line-height: 1.2; letter-spacing: -.035em; }
.eyebrow { color: var(--accent-deep); font-size: .71rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.subtitle, .clock span { color: var(--muted); font-size: .82rem; }
.clock { text-align: right; }
.clock strong { display: block; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
.header-tools { display: flex; align-items: center; gap: 14px; }
.teacher-login { display: inline-flex; align-items: center; min-height: 42px; padding: 7px 11px; border: 1px solid #e4cad9; border-radius: 9px; background: #fff; color: var(--accent-deep); font-size: .8rem; font-weight: 750; text-decoration: none; white-space: nowrap; }
.teacher-login:hover { background: var(--tint); }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 20px; padding: 23px 26px; border: 1px solid #ecdbe4; border-radius: 17px; background: #fff7fa; }
.hero p:last-child { margin-bottom: 0; }
h1, h2, h3, p { margin: 0 0 8px; }
h1 { margin-bottom: 7px; font-size: clamp(1.8rem, 3.3vw, 2.65rem); line-height: 1.12; letter-spacing: -.035em; }
h2 { font-size: 1.4rem; letter-spacing: -.018em; line-height: 1.25; }
h3 { font-size: 1rem; }
p { color: var(--muted); }
.counter, .metric { border: 1px solid var(--edge); border-radius: 13px; padding: 12px 16px; }
.counter { min-width: 116px; text-align: center; background: #fff; }
.counter strong, .metric strong { display: block; font-size: 1.48rem; line-height: 1.2; }
.counter span, .metric span { color: var(--muted); font-size: .82rem; }
.tabs, .actions, .subtabs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); align-items: stretch; margin-top: 14px; }
.mobile-nav { display: none; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
.tabs button, .button, .subtabs button, .month button {
  border: 1px solid var(--edge); border-radius: 10px; padding: 9px 13px;
  background: #fff; font-size: .83rem; font-weight: 700;
}
.tabs button[aria-pressed="true"], .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.tabs button:not([aria-pressed="true"]):hover, .button:not(.primary):hover, .subtabs button:not([aria-pressed="true"]):hover { background: var(--tint); }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.demo-note { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; font-size: .8rem; margin: 12px 0 8px; }
.demo-note strong { color: var(--accent-deep); }
.panel { min-width: 0; min-height: 238px; margin-bottom: 22px; padding: 22px; border: 1px solid var(--edge); border-radius: 17px; background: #fff; }
.panel > p { margin-bottom: 18px; }
.panel > .search-status { margin: 9px 0 0; font-size: .83rem; }
.search-grid { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1.3fr); gap: 12px; }
.search-grid label { min-width: 0; }
.search-matches { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; padding: 0; margin: 12px 0 0; list-style: none; }
.search-matches button { width: 100%; min-height: 48px; padding: 8px 10px; text-align: left; border: 1px solid var(--edge); border-radius: 9px; background: #fff; }
.search-matches button:hover { background: var(--tint); }
.search-matches strong, .search-matches span { display: block; }
.search-matches span { color: var(--muted); font-size: .78rem; }
.student-result { border-color: #eed5e2; background: #fff7fa; }
.student-result > p { margin-bottom: 12px; }
.student-result dl { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin: 0; }
.student-result dl div { min-width: 0; padding: 9px 10px; background: #fff; border: 1px solid var(--edge); border-radius: 8px; }
.student-result dt { color: var(--muted); font-size: .78rem; }
.student-result dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.filters, .two, .metrics, .org-top, .org-years { display: grid; gap: 12px; }
.filters, .org-top { grid-template-columns: repeat(3,minmax(0,1fr)); }
.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
.metrics, .org-years { grid-template-columns: repeat(4,minmax(0,1fr)); }
label { display: block; font-size: .86rem; font-weight: 700; }
select, input:not([type="file"]) {
  display: block; width: 100%; margin-top: 5px; min-height: 46px; border: 1px solid #dddbe1;
  border-radius: 10px; padding: 8px 11px; background: #fff; font-weight: 500;
}
select:disabled { background: #f8f8fa; color: #656b74; }
.surface, .slot, .calendar-card { min-width: 0; border: 1px solid var(--edge); border-radius: 13px; padding: 15px; background: #fff; }
.surface + .surface, .results, .actions, .subtabs, .jobs, .bars, .metrics { margin-top: 14px; }
.results p:last-child, .surface p:last-child { margin-bottom: 0; }
.metric { padding: 16px; }
.component-filter { max-width: 380px; margin-top: 19px; }
.bar-row { display: grid; grid-template-columns: minmax(110px,150px) minmax(0,1fr) 26px; align-items: center; gap: 12px; margin: 8px 0; font-size: .86rem; }
.bar-track { display: block; height: 12px; border-radius: 99px; background: #f4eff2; overflow: hidden; }
.bar-track span { display: block; height: 100%; background: #d93478; border-radius: inherit; }
progress { width: 100%; height: 11px; display: block; accent-color: var(--accent); }
.job-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.subtabs + .jobs { margin-top: 13px; }
.jobs { padding: 14px; border: 1px solid var(--edge); border-radius: 13px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; border: 1px solid var(--edge); padding: 8px 10px; }
th { background: #f7eaf0; }
tr:nth-child(even) td { background: #fdf9fb; }
.report-head { text-align: center; margin-bottom: 18px; }
.report-head .crest { width: 54px; height: 60px; }
.report-head h3 { color: var(--accent-deep); }
.org-top, .org-years { text-align: center; margin-bottom: 12px; }
.org-card { background: var(--tint); border: 1px solid #e5d0db; border-radius: 10px; padding: 8px; overflow-wrap: anywhere; font-size: .82rem; }
.org-card strong { display: block; color: var(--accent-deep); }
.org-years .org-card { margin: 6px 0; background: #fcf7fa; }
.report-table { margin-bottom: 16px; }
.panel-message { color: var(--accent-deep); margin-top: 10px; font-weight: 650; }
.admin-layout { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(0,1fr); gap: 15px; margin-top: 14px; }
.admin-form { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; }
.admin-form .actions { margin-top: 0; }
.admin-layout input[type="file"] { display: block; width: 100%; min-width: 0; margin-top: 5px; }
.note { background: var(--tint); border-left: 3px solid var(--accent); border-radius: 8px; padding: 12px; font-size: .85rem; }
.calendar-card { max-width: 590px; }
.month { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 10px; }
.days { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 3px; text-align: center; }
.day, .weekday { min-height: 32px; display: grid; place-items: center; font-size: 14px; }
.weekday { color: var(--muted); font-size: 12px; font-weight: 700; }
.day[aria-current] { border: 1px solid var(--accent); border-radius: 7px; }
.events { border-top: 1px solid var(--edge); margin-top: 12px; padding-top: 12px; }
footer { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 14px 0 22px; border-top: 1px solid var(--edge); color: var(--muted); font-size: .8rem; }
@media (max-width: 760px) {
  .wrap { width: calc(100% - 28px); }
  .hero { margin-top: 11px; padding: 13px 15px; }
  .tabs { display: none; }
  .mobile-nav { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 8px; margin-top: 11px; }
  .mobile-nav select { margin: 0; }
  .panel { padding: 14px; margin-bottom: 14px; }
  .panel > p { margin-bottom: 12px; }
  .search-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
  .search-matches { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .search-grid .name-query, .search-grid label:last-child { grid-column: 1 / -1; }
  select, input:not([type="file"]) { font-size: 16px; min-height: 44px; }
  .filters, .admin-layout { grid-template-columns: minmax(0,1fr); }
  .metrics, .org-years { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media (max-width: 460px) {
  .header { min-height: 72px; gap: 8px; }
  .identity { gap: 7px; }
  .identity strong { font-size: 17px; }
  .crest { width: 42px; height: 50px; }
  .clock span { font-size: .68rem; }
  .clock strong { font-size: .96rem; }
  .header-tools { align-items: flex-end; flex-direction: column; gap: 3px; padding: 6px 0; }
  .teacher-login { min-height: 32px; padding: 3px 8px; font-size: .74rem; }
  h1 { font-size: clamp(1.35rem, 6vw, 1.7rem); }
  .hero p:last-child { font-size: .86rem; }
  .counter { display: none; }
  .demo-note { margin-top: 8px; }
  .student-result dl { grid-template-columns: 1fr; }
  .two, .org-top { grid-template-columns: minmax(0,1fr); }
  .subtabs button { padding: 7px 9px; }
  .bar-row { grid-template-columns: 100px minmax(0,1fr) 22px; gap: 6px; }
}
@media print {
  body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  body.printing > :not(main), body.printing main > :not(#panel), body.printing #panel > :not(.report) { display: none; }
  body.printing main { width: 100%; }
  body.printing .org-top { grid-template-columns: repeat(3,minmax(0,1fr)); }
  body.printing .org-years { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .org-card, tr, .report-head { break-inside: avoid; }
}

.teacher-main { margin-top: 18px; }
.teacher-main .panel { min-height: 0; }
.teacher-main h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); }
.portal-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.portal-heading div { min-width: 0; overflow-wrap: anywhere; }
.return-link { color: var(--accent-deep); font-size: .84rem; font-weight: 700; }
#session-email { font-size: .85rem; }
#admin form { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--edge); }
#admin input, #admin select { max-width: 420px; }
#admin input[type="file"] { display: block; width: 100%; margin: 5px 0; }
#gate form { max-width: 430px; }
#gate label + label { margin-top: 9px; }
#gate #sign-in, #gate #reset-password, #gate-sign-out { margin-top: 12px; }
#teacher-admin { margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--edge); }
.teacher-list { list-style: none; margin: 12px 0 0; padding: 0; }
.teacher-list li { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--edge); padding: 9px 0; }
.teacher-list span, .teacher-list strong { display: block; overflow-wrap: anywhere; }
.teacher-list span { color: var(--muted); font-size: .82rem; }
#gate-message, #directory-status, #import-status, #teacher-status { overflow-wrap: anywhere; }

</style>
</head>

<main class="wrap teacher-main">
  <section class="panel" id="gate" aria-labelledby="gate-title">
    <h1 id="gate-title">Log Masuk Guru</h1>
    <p id="gate-message" role="status">Menyemak sesi…</p>
    <form id="login-form" hidden>
      <label>E-mel<input id="login-email" type="email" required maxlength="254" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Kata laluan<input id="login-password" type="password" required autocomplete="current-password"></label>
      <div class="actions">
        <button class="button primary" id="login-button" type="submit">Log masuk</button>
        <button class="button" id="register-link" type="button">Daftar sendiri</button>
      </div>
      <button class="button" id="reset-password" type="button">Lupa kata laluan</button>
      <button id="sign-in" class="button" type="button" disabled>Log masuk Google</button>
    </form>
    <form id="register-form" hidden>
      <label>Nama penuh guru<input id="register-name" type="text" required minlength="2" maxlength="100" autocomplete="name"></label>
      <label>E-mel pilihan<input id="register-email" type="email" required maxlength="254" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Kata laluan<input id="register-password" type="password" minlength="8" maxlength="120" required autocomplete="new-password"></label>
      <div class="actions">
        <button class="button primary" id="register-button" type="submit">Daftar dan hantar pautan pengesahan</button>
        <button class="button" id="login-link" type="button">Kembali ke log masuk</button>
      </div>
    </form>
    <div id="verification" class="actions" hidden>
      <button class="button primary" id="check-verification" type="button">Saya sudah sahkan e-mel</button>

      <label>Nama penuh guru<input id="teacher-name" required maxlength="100" autocomplete="name"></label>
      <label>Kod sementara sekolah<input id="enrollment-code" type="password" required minlength="8" maxlength="100" autocomplete="off"></label>
      <div class="actions"><button class="button primary" id="enroll-button" type="submit">Aktifkan akses guru</button></div>
      <p id="enrollment-status" role="status"></p>
    </form>
    <button id="gate-sign-out" class="button" type="button" hidden>Keluar</button>
  </section>
  <section class="panel" id="portal" aria-labelledby="portal-title" hidden>
    <div class="portal-heading">
      <div><h1 id="portal-title">Carian Murid</h1><p id="session-email"></p></div>
      <button type="button" class="button" id="sign-out">Keluar</button>
    </div>
    <p id="directory-status" role="status"></p>
    <div id="directory" hidden>
      <div class="search-grid">
        <label class="name-query">Cari mengikut nama<input id="query" type="search" autocomplete="off" spellcheck="false"></label>
        <label>Tahun<select id="year"></select></label>
        <label>Kelas<select id="class"></select></label>
        <label>Pilih nama murid<select id="student"></select></label>
      </div>
      <p id="match-status" class="search-status" role="status"></p>
      <div id="student-card"></div>
    </div>
  </section>

      <form id="invitation-form">
        <label>Kod sementara sekolah<input id="invitation-code" type="password" required minlength="8" maxlength="100" autocomplete="off"></label>

        <div class="actions">
          <button class="button primary" type="submit">Aktifkan kod selama 24 jam</button>

        </div>

      <label>Cari guru<input id="teacher-filter" type="search" autocomplete="off"></label>
      <p id="teacher-status" role="status"></p>
      <ul id="teacher-list" class="teacher-list"></ul>
    </div>
  </section>

const expectedHeaders = ['id', 'nama', 'tahun', 'kelas', 'jantina', 'unit_beruniform', 'kelab_persatuan', 'sukan_permainan'];

function classKey(student) {
  return student.tahun + '-' + student.kelas;
}

function prepareImport(text) {
  const { headers, values } = parseCsv(text);
  if (headers.length !== expectedHeaders.length || !expectedHeaders.every(header => headers.includes(header))) {
    throw new Error('Gunakan draf CSV 2027 dengan lajur asal.');
  }
  if (values.length !== 552) throw new Error('Fail ini mesti mengandungi tepat 552 rekod.');
  const ids = new Set();
  const groups = new Map(classKeys.map(key => [key, []]));
  for (const row of values) {
    const record = {
      id: row.id,
      nama: row.nama,
      tahun: Number(row.tahun),
      kelas: row.kelas.toUpperCase(),
      ub: row.unit_beruniform,
      kp: row.kelab_persatuan,
      sp: row.sukan_permainan,
    };
    const group = groups.get(classKey(record));
    if (!group || !/^XBA3037-[A-Za-z0-9]{12}$/.test(record.id) || ids.has(record.id)
      || !record.nama || record.nama.length > 150 || [record.ub, record.kp, record.sp].some(unit => unit.length > 100)) {
      throw new Error('Fail mengandungi ID pendua, kelas di luar senarai draf atau rekod tidak sah.');
    }
    ids.add(record.id);
    group.push(record);
  }
  for (const [index, year] of years.entries()) {
    const sizes = classes.map(name => groups.get(year + '-' + name).length);
    if (sizes.some(size => size < 30 || size > 40) || sizes.reduce((sum, size) => sum + size, 0) !== countByYear[index]) {
      throw new Error('Bilangan murid mengikut tahun atau kelas tidak sepadan dengan draf.');
    }
  }
  return groups;
}

function filterStudents(students, { query, year, className }) {
  const words = query.trim().toLocaleLowerCase('ms').split(/\s+/).filter(Boolean);
  return students.filter(student =>
    (!year || Number(year) === student.tahun)
    && (!className || className === student.kelas)
    && words.every(word => student.nama.toLocaleLowerCase('ms').includes(word)));
}

function parseCsv(text) {
  const raw = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  let closed = false;
  const pushCell = () => {
    row.push(cell.trim());
    cell = '';
    closed = false;
  };
  const pushRow = () => {
    pushCell();
    if (row.some(Boolean)) rows.push(row);
    row = [];
  };
  for (let index = 0; index < raw.length; index++) {
    const character = raw[index];
    if (quoted) {
      if (character === '"' && raw[index + 1] === '"') { cell += '"'; index++; }
      else if (character === '"') { quoted = false; closed = true; }
      else cell += character;
    } else if (character === ',') pushCell();
    else if (character === '\n' || character === '\r') {
      if (character === '\r' && raw[index + 1] === '\n') index++;
      pushRow();
    } else if (closed && character.trim()) {
      throw new Error('Format tanda petikan CSV tidak sah.');
    } else if (!closed && character === '"') {
      if (cell.trim()) throw new Error('Format tanda petikan CSV tidak sah.');
      quoted = true;
    } else cell += character;
  }
  if (quoted) throw new Error('Terdapat medan CSV dengan tanda petikan yang belum ditutup.');
  pushRow();
  const [headers = [], ...values] = rows;
  if (headers.some((name) => !name) || new Set(headers).size !== headers.length ||
      values.some((fields) => fields.length !== headers.length)) {
    throw new Error('Setiap baris mesti mempunyai bilangan lajur yang sama dengan tajuk CSV.');
  }
  return { headers, values: values.map((fields) => Object.fromEntries(headers.map((key, index) => [key, fields[index]]))) };
}

function loginAddress(value) {
  const email = value.trim().toLowerCase();
  return /^[^@/\s]+@[^@/\s]+[.][^@/\s]+$/.test(email) && email.length <= 254 ? email : '';
}

async function invitationDigest(value) {
  const code = value.trim();
  if (code.length < 8 || code.length > 100) return '';
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code));
  return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
}

    if (current !== generation || snapshot.metadata.fromCache || snapshot.metadata.hasPendingWrites) return;
    const invite = snapshot.data();
    const expires = invite?.expiresAt?.toDate();
    const open = invite?.digest && expires > new Date();
    status('invitation-state', open ? 'Kod dibuka sehingga ' + new Intl.DateTimeFormat('ms-MY', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kuching',
    }).format(expires) + ' (waktu Malaysia).' : 'Kod sementara ditutup atau sudah tamat.');
  }, () => {
    if (current === generation) status('invitation-state', 'Status kod belum dapat disemak.');
  });
}
async function saveInvitation(close) {
  if (permission !== 'admin') return;
  const current = generation;
  try {
    const digest = close ? '' : await invitationDigest($('invitation-code').value);
    if (!close && !digest) {
      status('invitation-state', 'Kod perlu mengandungi sekurang-kurangnya 8 aksara.');
      return;
    }
    if (current !== generation) return;
    if (!close && !window.confirm('Aktifkan kod selama 24 jam? Sesiapa yang memiliki kod dan mengesahkan e-mel boleh mendaftar untuk melihat rekod murid.')) return;
    await setDoc(invitation, { digest, expiresAt: close ? serverTimestamp() : Timestamp.fromMillis(Date.now() + 24 * 60 * 60 * 1000) });
    if (current === generation) $('invitation-form').reset();
  } catch {
    if (current === generation) status('invitation-state', 'Tetapan kod belum dapat disimpan. Cuba lagi.');
  }
}
$('invitation-form').addEventListener('submit', event => {
  event.preventDefault();
  saveInvitation(false);
});
$('close-invitation').addEventListener('click', () => saveInvitation(true));

</script>
</body>
